<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VÄLI</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  canvas { display: block; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: #fff; opacity: .85; pointer-events: none; display: none;
    transition: transform .12s, background .12s; }
  #crosshair.hot { transform: scale(1.8); background: #ffd54a; }
  body.playing #crosshair { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72); cursor: pointer; z-index: 10; }
  body.playing #overlay { display: none; }
  #overlay .box { text-align: center; max-width: 560px; padding: 24px; }
  #overlay h1 { font-size: 56px; letter-spacing: .08em; font-weight: 800; }
  #overlay .by { opacity: .7; margin-top: 4px; }
  #overlay .start { margin-top: 28px; font-size: 20px; padding: 12px 28px; border: 1px solid #fff;
    border-radius: 999px; display: inline-block; }
  #overlay .help { margin-top: 24px; opacity: .75; line-height: 1.7; font-size: 15px; }
  #overlay kbd { display: inline-block; min-width: 26px; padding: 1px 6px; border: 1px solid rgba(255,255,255,.5);
    border-radius: 4px; font-family: inherit; font-size: 13px; }
  #volume-box { position: fixed; top: 16px; right: 16px; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 13px; user-select: none; }
  #volume-box svg { width: 18px; height: 18px; fill: #fff; flex: none; }
  #volume { width: 140px; accent-color: #fff; cursor: pointer; }
  #volume-box .hint { opacity: .55; }
  #progress { margin-top: 18px; font-size: 14px; opacity: .7; }
  body.loaded #progress { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="overlay">
  <div class="box">
    <h1 id="title">VÄLI</h1>
    <div class="by" id="author"></div>
    <div id="progress">Loading…</div>
    <div class="start">Click to enter</div>
    <div class="help">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — walk, mouse — look around, <kbd>Shift</kbd> — run<br>
      Click a floor button to play / stop its sound, click the screen to play the video<br>
      If the cursor is not captured, drag with the mouse button held to look around<br>
      Volume — slider in the top right corner or <kbd>−</kbd> <kbd>+</kbd><br>
      <kbd>Esc</kbd> — pause
    </div>
  </div>
</div>
<div id="crosshair"></div>
<label id="volume-box" title="Volume (− and + keys)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <input id="volume" type="range" min="0" max="100" step="1" value="5" aria-label="Volume">
  <span class="hint">− / +</span>
</label>
<script type="module" src="./main.js"></script>
</body>
</html>
