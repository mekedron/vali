<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VÄLI — Tour</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.78); cursor: pointer; z-index: 10; }
  body.playing #overlay { display: none; }
  #overlay .box { text-align: center; max-width: 620px; padding: 24px; }
  #overlay h1 { font-size: 64px; letter-spacing: .08em; font-weight: 800; }
  #overlay .by { opacity: .7; margin-top: 4px; }
  #overlay .start { margin-top: 32px; font-size: 20px; padding: 12px 30px; border: 1px solid #fff;
    border-radius: 999px; display: inline-block; }
  #overlay .help { margin-top: 26px; opacity: .75; line-height: 1.9; font-size: 15px; }
  kbd { display: inline-block; min-width: 24px; padding: 0 6px; border: 1px solid rgba(255,255,255,.5);
    border-radius: 4px; font-family: inherit; font-size: 12px; line-height: 20px; }
  #progress { margin-top: 18px; font-size: 14px; opacity: .7; }
  body.loaded #progress { display: none; }

  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px 22px; text-align: center;
    pointer-events: none; display: none; z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  body.playing #hud { display: block; }
  #hud .title { font-size: 26px; font-weight: 700; letter-spacing: .03em; transition: opacity .5s; }
  #hud .subtitle { font-size: 15px; opacity: .75; margin-top: 2px; min-height: 18px; transition: opacity .5s; }
  #hud.switching .title, #hud.switching .subtitle { opacity: 0; }
  #dots { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  #dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); transition: all .3s; }
  #dots span.on { background: #fff; transform: scale(1.3); }
  #hud .hint { margin-top: 12px; font-size: 13px; opacity: .6; }

  #volume-box { position: fixed; top: 16px; right: 16px; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 13px; }
  #volume-box svg { width: 18px; height: 18px; fill: #fff; flex: none; }
  #volume { width: 140px; accent-color: #fff; cursor: pointer; }
  #volume-box .hint { opacity: .55; }
  @media (max-width: 600px) { #overlay h1 { font-size: 44px; } #volume { width: 90px; } #volume-box .hint { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="vignette"></div>
<div id="overlay">
  <div class="box">
    <h1 id="title">VÄLI</h1>
    <div class="by" id="author"></div>
    <div id="progress">Loading…</div>
    <div class="start">Click to start the tour</div>
    <div class="help">
      Left click — next &nbsp;·&nbsp; right click — back<br>
      Move the mouse to look around<br>
      <kbd>→</kbd> / <kbd>Space</kbd> next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>R</kbd> replay &nbsp; <kbd>1</kbd>–<kbd>9</kbd> jump &nbsp; <kbd>Esc</kbd> pause
    </div>
  </div>
</div>
<div id="hud">
  <div class="title" id="stop-title"></div>
  <div class="subtitle" id="stop-subtitle"></div>
  <div id="dots"></div>
  <div class="hint">Left click — next &nbsp;·&nbsp; right click — back &nbsp;·&nbsp; <kbd>R</kbd> replay</div>
</div>
<label id="volume-box" title="Volume (− and + keys)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <input id="volume" type="range" min="0" max="100" step="1" value="5" aria-label="Volume">
  <span class="hint">− / +</span>
</label>
<script type="module" src="./tour.js"></script>
</body>
</html>
